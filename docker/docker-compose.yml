version: '3.8'

services:
  openclaw:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openclaw-secure
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"  # Only bind to localhost
    environment:
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-auto-generated}
      - OPENCLAW_LOG_LEVEL=info
    volumes:
      - openclaw-data:/home/openclaw/.openclaw
      - ./workspace:/home/openclaw/.openclaw/workspace
    networks:
      - openclaw-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    user: "1000:1000"

volumes:
  openclaw-data:
    driver: local

networks:
  openclaw-network:
    driver: bridge
    internal: false
